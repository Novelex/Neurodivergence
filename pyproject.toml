[project]
name = "neurodiversity"
version = "0.1.0"
description = "A multi agent chatbot designed specifically for neurodivese community"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "supabase>=2.9",
    "psycopg[binary]>=3.2",
    "openai>=1.55",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurodiversity"]
